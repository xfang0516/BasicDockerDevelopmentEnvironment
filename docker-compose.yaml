services:
  redis:
    image: redis:6-alpine
    restart: always
    ports:
      - '6379:6379'
  mysql:
    image: mysql:8.4.4
    restart: always
    volumes:
      - ./db/8:/var/lib/mysql
    ports:
      - '3306:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_ROOT_HOST=%
    command: --default-time-zone='Asia/Singapore'
  mqnamesrv:
    image: apache/rocketmq
    restart: always
    container_name: mqnamesrv
    network_mode: host
    ports:
      - '9876:9876'
    environment:
      - JAVA_OPT=-Xms512m -Xmx512m -Xmn256m
    logging:
      options:
        max-size: '10m'
        max-file: '5'
    volumes:
      - rocketmq-data:/opt/rocketmq/
      - ./conf/logback_namesrv.xml:/opt/rocketmq/conf/logback.xml
    command: sh mqnamesrv
  mqbroker:
    image: apache/rocketmq
    restart: always
    container_name: mqbroker
    network_mode: host
    ports:
      - '10911:10911'
      - '10909:10909'
    environment:
      - JAVA_OPT_EXT=-Xms512m -Xmx512m -Xmn256m
      - NAMESRV_ADDR=127.0.0.1:9876
    logging:
      options:
        max-size: '10m'
        max-file: '5'
    volumes:
      - rocketmq-data:/opt/rocketmq/store
      - ./config/logback_broker.xml:/opt/rocketmq/conf/logback.xml
      - ./config/broker.conf:/opt/rocketmq/conf/broker.conf
    command: sh mqbroker -c /opt/rocketmq/conf/broker.conf
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rocketmq-dashboard
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=127.0.0.1:9876 -Xms512m -Xmx512m
    ports:
      - '8080:8080'
    depends_on:
      - mqnamesrv
      - mqbroker
    network_mode: host
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    restart: always
    container_name: minio
    environment:
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
    ports:
      - '9002:9000'
      - '9001:9001'
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001" --json
  rabbitmq:
    build:
      context: ./rabbitmq
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=123456
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  elasticsearch:
    image: elasticsearch:8.18.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - es_data:/usr/share/elasticsearch/data
  # nexus:
  #   image: sonatype/nexus3
  #   container_name: nexus
  #   ports:
  #     - '8081:8081'
  #   volumes:
  #     - ./nexus-data:/nexus-data
  # pdf-util:
  #   image: swr.ap-southeast-3.myhuaweicloud.com/ccpay/pdf-util:test
  #   container_name: pdf-util
  #   ports:
  #     - '5100:5000'
  nginx:
    image: nginx
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./html:/usr/share/nginx/html:ro
  # nacos:
  #   image: hyperagi/nacos-client:last
  #   environment:
  #     - PUBLIC_IP=43.159.42.232
  #     - NODE=43.159.42.232:2
  #     - PORT=1082
  #     - WALLET_ADDRESS=0xaaC73e223DEc87218d849992b73B52be81910cAc
  #     - SERVICE_NAME=MFDoom/deepseek-r1-tool-calling:32b
  #   restart: always
  # Nacos：四选一启动，host 模式共用 8848 端口，同时只能运行一个
  #   docker compose --profile via up -d via_nacos
  #   docker compose --profile em up -d otc_nacos
  #   docker compose --profile uka up -d uka_nacos
  #   docker compose --profile unibit up -d dcs_nacos
  # 切换前先停掉当前实例: docker compose stop via_nacos
  via_nacos:
    profiles: [via]
    image: nacos/nacos-server:v2.4.3
    container_name: via_nacos
    network_mode: host
    volumes:
      - via_nacos-data:/home/nacos/data
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=127.0.0.1
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=via_nacos
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=123456
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
  otc_nacos:
    profiles: [em]
    image: nacos/nacos-server:v2.4.3
    container_name: otc_nacos
    network_mode: host
    volumes:
      - otc_nacos-data:/home/nacos/data
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=127.0.0.1
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=otc_nacos
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=123456
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
  uka_nacos:
    profiles: [uka]
    image: nacos/nacos-server:v2.4.3
    container_name: uka_nacos
    network_mode: host
    volumes:
      - uka_nacos-data:/home/nacos/data
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=127.0.0.1
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=uka_nacos
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=123456
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
  dcs_nacos:
    profiles: [unibit]
    image: nacos/nacos-server:v2.4.3
    container_name: dcs_nacos
    network_mode: host
    volumes:
      - dcs_nacos-data:/home/nacos/data
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=127.0.0.1
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=dcs_nacos
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=123456
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
volumes:
  rocketmq-data:
  rabbitmq_data:
  redis-stack-data:
  neo4j_data:
  neo4j_logs:
  es_data:
  via_nacos-data:
  otc_nacos-data:
  uka_nacos-data:
  dcs_nacos-data:
